# Included only in the zskj.top HTTPS server; independent of website releases.
location = /cz-updates/latest.json {
    alias /var/www/cz-updates/latest.json;
    default_type application/json;
    if (!-f /var/www/cz-updates/latest.json) { return 503; }
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
location ~ ^/cz-updates/releases/([0-9]+\.[0-9]+\.[0-9]+)/((?:CZToolbox-[0-9]+\.[0-9]+\.[0-9]+-setup\.exe)|SHA256SUMS|latest\.json)$ {
    alias /var/www/cz-updates/releases/$1/$2;
    default_type application/octet-stream;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    limit_except GET { deny all; }
}
location /cz-updates/ { return 404; }
